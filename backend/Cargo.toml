[package]
name = "lutra"
version = "0.5.2"
description = "The backend of Lutra, a modern game library and launcher for Linux"
authors = ["Lutra contributors"]
license = "GPL-3.0-or-later"
edition = "2024"
default-run = "lutra-backend"

[[bin]]
name = "lutra-backend"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "lutra_lib"
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
ureq = { version = "3", features = ["json"] }
flate2 = "1"
shlex = "2.0.1"
evdev = "0.13.2"
libc = "0.2.191"

# Read the optimization guideline for more details: https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
tempfile = "3.27.0"
