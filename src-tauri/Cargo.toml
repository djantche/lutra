[package]
name = "lutra"
version = "0.1.0"
description = "A modern game library and launcher for Linux"
authors = ["Lutra contributors"]
license = "GPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lutra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.42.0", features = ["bundled"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
tauri-plugin-dialog = "2.8.4"
ureq = { version = "3", features = ["json"] }
shlex = "2.0.1"
evdev = "0.13.2"
libc = "0.2.191"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }
md-5 = "0.11.0"
# Lutra's own libretro player (`lutra --play`): window, OpenGL and sound.
winit = "0.30"
glutin = "0.32"
glutin-winit = "0.5"
glow = "0.16"
cpal = "0.15"
raw-window-handle = "0.6"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
